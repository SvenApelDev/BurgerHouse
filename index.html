<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>BurgerHouse</title>

		<link
			rel="icon"
			href="./assets/icons/ic-burger.svg"
			type="image/svg+xml"
		/>
		<link rel="stylesheet" href="style.css" />

		<script defer src="./script.js"></script>
	</head>

	<body>
		<!-- ////// HEADER ////// -->
		<header>
			<div class="content header-content">
				<div class="logo">
					<img src="assets/icons/ic-logo.svg" alt="" />
				</div>
				<button class="menu-toggle">
					<img src="assets/icons/ic-menu.svg" alt="" />
				</button>
			</div>
			<div
				class="menu-backdrop"
				id="menu-backdrop"
				onclick="closeMenu()"
			></div>
		</header>

		<!-- ////// HERO ////// -->
		<section class="hero">
			<div class="hero-content">
				<div class="hero-image-wrapper">
					<img
						class="hero-image-mobile"
						src="assets/images/hero-image-mobile.jpg"
						alt=""
					/>
					<img
						class="hero-image-desktop"
						src="assets/images/hero-image-desktop.jpg"
						alt=""
					/>
					<img
						class="hero-logo"
						src="assets/images/logo-badge.png"
						alt=""
					/>
				</div>
			</div>
		</section>

		<!-- ////// RESTAURANT-TEASER ////// -->
		<section class="restaurant-teaser">
			<div class="content-teaser">
				<div class="titel-rating-container">
					<div class="content-rating">
						<img
							class="rating-img"
							src="assets/icons/ic-star.svg"
							alt=""
						/>
						<span class="rating-text-1">4,1</span>
						<span class="rating-text-2">(317)</span>
					</div>
					<h1 class="teaser-title">
						<span class="burger-title">Burger</span
						><span class="house-title">House</span>
					</h1>
				</div>
				<p class="teaser-subline">
					The best of Burgers, Pizza, and Greens, all in one great
					place.
				</p>
			</div>
		</section>

		<!-- ////// MENU (mit schwebendem BASKET) ////// -->
		<main class="menu">
			<!-- BASKET-Ebene: height 0, schwebt rechts sticky, überlappt die Banner -->
			<div class="basket-layer">
				<div class="content basket-content">
					<aside class="basket" id="basket">
						<div class="basket-header">
							<button
								class="basket-close"
								onclick="closeBasket()"
							>
								<img
									src="assets/icons/ic-close.svg"
									alt="Warenkorb schließen"
								/>
							</button>
							<h2>Your Basket</h2>
						</div>

						<div class="basket-items" id="basket-items">
							<!-- Warenkorb-Zeilen via JS -->
						</div>

						<div class="basket-invoice" id="basket-invoice">
							<p class="basket-subtotal">
								<span>Subtotal</span>
								<span id="subtotal">0,00 €</span>
							</p>
							<p class="basket-delivery">
								<span>Delivery fee</span>
								<span id="delivery-fee">4,99 €</span>
							</p>
							<p class="basket-total">
								<span>Total</span>
								<span id="total">0,00 €</span>
							</p>
							<button
								class="buy-btn"
								id="buy-btn"
								onclick="checkout()"
							>
								Buy now
							</button>
						</div>
					</aside>
				</div>
			</div>

			<!-- Burger -->
			<section class="category" id="burger">
				<div class="category-banner">
					<div class="content banner-content">
						<img
							class="banner-img"
							src="assets/icons/ic-burger.svg"
							alt="Burger Icon"
						/>
						<h2 class="banner-title">Burger</h2>
					</div>
				</div>
				<div class="content">
					<div class="product-list" id="list-burger"></div>
				</div>
			</section>

			<!-- Pizza -->
			<section class="category" id="pizza">
				<div class="category-banner">
					<div class="content banner-content">
						<img
							class="banner-img"
							src="assets/icons/ic-pizza.svg"
							alt="Pizza Icon"
						/>
						<h2 class="banner-title">
							Pizza<span class="pizza-subline">(30cm)</span>
						</h2>
					</div>
				</div>
				<div class="content">
					<div class="product-list" id="list-pizza"></div>
				</div>
			</section>

			<!-- Salad -->
			<section class="category" id="salad">
				<div class="category-banner">
					<div class="content banner-content">
						<img
							class="banner-img"
							src="assets/icons/ic-salad.svg"
							alt="Salad Icon"
						/>
						<h2 class="banner-title">Salad</h2>
					</div>
				</div>
				<div class="content">
					<div class="product-list" id="list-salad"></div>
				</div>
			</section>
		</main>

		<!-- ////// FOOTER ////// -->
		<footer>
			<div class="content footer-content">
				<p>Imprint</p>
				<p>Cookie Preferences</p>
				<p class="copyright">&copy; 2026 BurgerHouse</p>
			</div>
		</footer>

		<!-- ////// BOTTOM NAV (MOBILE) ////// -->
		<nav class="bottom-nav">
			<button class="nav-item" onclick="">
				<img src="assets/icons/ic-home.svg" alt="Startseite" />
			</button>
			<button class="nav-item" onclick="">
				<img src="assets/icons/ic-profile.svg" alt="Profil" />
			</button>
			<button class="nav-item" onclick="">
				<img src="assets/icons/ic-orders.svg" alt="Menü" />
			</button>
			<button class="nav-item nav-basket" onclick="openBasket()">
				<img src="assets/icons/ic-basket.svg" alt="Warenkorb" />
				<span class="basket-badge" id="basket-badge">0</span>
			</button>
		</nav>

		<!-- ////// CONFIRMATION (OVERLAY) ////// -->
		<div
			class="confirmation"
			id="confirmation"
			onclick="closeConfirmation()"
		>
			<div class="confirmation-wrapper">
				<button class="confirm-close" onclick="closeConfirmation()">
					<img src="assets/icons/ic-close.svg" alt="Schließen" />
				</button>
				<img src="assets/images/confirmed.png" alt="" />
				<div class="confirm-box">
					<h2>Order confirmed!</h2>
					<p>Your food is on the way!</p>
				</div>
			</div>
		</div>
	</body>
</html>
